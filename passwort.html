<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="description" content="Besprechungen aufnehmen, automatisch zusammenfassen und als To-dos weiterarbeiten. Deine Inhalte bleiben auf deinem Handy.">

</head>
<body>
<header>
  <a class="brand" href="index.html">OG <span>Summary</span></a>
  <nav>
    <a href="index.html#funktionen">Funktionen</a>
    <a href="index.html#tarife">Tarife</a>

    <a href="en/index.html">English</a>
  </nav>
</header>
<main>
<article class="card">
<h1>Neues Passwort festlegen</h1>
<p class="meta">Gib ein neues Passwort für dein Konto bei OG Summary ein.</p>
<p id="status">Link wird geprüft …</p>
<noscript><p>JavaScript is required.</p></noscript>
<form id="form" class="form" hidden>
  <label for="pw">Neues Passwort</label>
  <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
  <label for="pw2">Passwort wiederholen</label>
  <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
  <span class="meta">Mindestens 8 Zeichen.</span>
  <label class="check"><input id="show" type="checkbox"> Passwort anzeigen</label>
  <button id="save" class="btn" type="submit">Passwort speichern</button>
</form>
<div id="msg" class="msg" hidden></div>
</article>
<script>
(function () {
  var T = {
    mismatch: "Die Passwörter stimmen nicht überein.", tooShort: "Das Passwort muss mindestens 8 Zeichen haben.", done: "Dein Passwort wurde geändert. Öffne OG Summary und melde dich mit dem neuen Passwort an.",
    invalid: "Dieser Link ist abgelaufen oder wurde schon verwendet. Fordere in der App unter „Passwort vergessen?“ einen neuen Link an.", failed: "Das Passwort konnte nicht gespeichert werden. Bitte versuche es erneut.", saving: "Wird gespeichert …", save: "Passwort speichern"
  };
  var URL_BASE = 'https://zroacbshmpbgxeohnhri.supabase.co', KEY = 'sb_publishable_CAIb6prpZ4St0QlHiBgbzg_BVX4N98u';
  var form = document.getElementById('form'), msg = document.getElementById('msg'), status = document.getElementById('status');
  function show(text, isError) { msg.textContent = text; msg.className = 'msg' + (isError ? ' err' : ''); msg.hidden = false; }
  // Token aus dem Link lesen und sofort aus der Adresszeile entfernen
  var hash = new URLSearchParams(location.hash.slice(1));
  var token = hash.get('access_token');
  if (location.hash) history.replaceState(null, '', location.pathname);
  status.hidden = true;
  if (hash.get('error') || hash.get('error_code') || !token) { show(T.invalid, true); return; }
  form.hidden = false;
  document.getElementById('show').addEventListener('change', function (ev) {
    var type = ev.target.checked ? 'text' : 'password';
    document.getElementById('pw').type = type; document.getElementById('pw2').type = type;
  });
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
    if (pw.length < 8) return show(T.tooShort, true);
    if (pw !== pw2) return show(T.mismatch, true);
    var button = document.getElementById('save'); button.disabled = true; button.textContent = T.saving;
    var headers = { 'apikey': KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
    fetch(URL_BASE + '/auth/v1/user', { method: 'PUT', headers: headers, body: JSON.stringify({ password: pw }) })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) { form.hidden = true; show(T.invalid, true); return; }
        if (!r.ok) throw new Error('status ' + r.status);
        form.hidden = true; show(T.done, false);
        // Sitzung aus dem Link beenden, angemeldet wird in der App
        fetch(URL_BASE + '/auth/v1/logout', { method: 'POST', headers: headers }).catch(function () {});
      })
      .catch(function () { button.disabled = false; button.textContent = T.save; show(T.failed, true); });
  });
})();
</script>
</main>

</html>
